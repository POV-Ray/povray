name: 'Code Analysis'

on:
  push:
    branches: [ 'master', 'release/*' ]
    # There's no actual source code to examine in the following directories.
    paths-ignore: [ 'distribution/**', 'doc/**', 'source-doc/**', 'tools/**' ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ 'master', 'release/*' ]
    # There's no actual source code to examine in the following directories.
    paths-ignore: [ 'distribution/**', 'doc/**', 'source-doc/**', 'tools/**' ]

jobs:
  analyze:
    name: 'Analyze'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:

    - name: 'Check out Repository'
      uses: actions/checkout@v7

    - name: 'Initialize CodeQL'
      uses: github/codeql-action/init@v4
      with:
        languages: cpp
        # Comment out the following to perform just the bare minimum of checks:
        queries: security-extended
        # Use the following instead to perform the whole suite of pre-defined checks:
        # queries: security-and-quality

    - name: 'Install Prerequisites'
      uses: ./.github/actions/unix_getlibs

    - name: 'Prebuild'
      uses: ./.github/actions/unix_prebuild
    - name: 'Configure'
      uses: ./.github/actions/unix_configure
    - name: 'Build'
      uses: ./.github/actions/unix_make

    - name: 'Perform CodeQL Analysis'
      uses: github/codeql-action/analyze@v4
